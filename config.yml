# Rokabot Configuration
# Secrets (DISCORD_TOKEN, DISCORD_CLIENT_ID, GEMINI_API_KEY) stay in .env
# Environment variables override values only where `src/config.ts` wires them.

jev:
  model: jev-1.13.0 # Pinned Jev version; thresholds are tuned against one version, and the jev-latest alias moves
  timeoutMs: 1200 # Deadline for the in-reply judgment (Pi median ~0.5s); one attempt, no retries
  memoryTimeoutMs: 5000 # Deadline for background memory admission and verification judgments
  tone: shadow # off | shadow (ask Jev and log, change nothing) | on (Jev picks the tone)
  referents: shadow # off | shadow | on (Jev settles names the resolver found ambiguous)
  toneMinConfidence: 0.6 # In on mode, below this confidence the rule-based tone stays
  referentMinConfidence: 0.8 # In on mode, below this confidence an ambiguous name stays unresolved

gemini:
  model: gemini-3.5-flash-lite # Gemini model ID
  # extractionModel: gemini-3.5-flash-lite # Optional background fact-extraction model (defaults to model)
  timeout: 20000 # API request timeout in ms (covers initial Gemini → tool → second Gemini round; ~2x measured p95 of 9801ms, 2026-07-29 n=78, with headroom over the 13613ms worst observed tool chain, while still admitting two retries inside turnDeadlineMs)
  maxRetries: 3 # Max retries for transient errors (429, 500, 503)
  maxOutputTokens: 500 # Max tokens per response (safety net)
  maxAttachmentTokens: 50000 # Max measured token cost of one turn's attachments before they are refused. Size does not bound this: a PDF is ~560 tokens/page, so a 17 KB document can cost 28,000. 50,000 is a fifth of the 250,000 TPM ceiling, admitting three max-length audio clips and refusing a 200-page PDF.
  maxTokensPerMinute: 125000 # Tokens per rolling minute the bot will spend before it declines new attachment turns. Half the measured 250,000 ceiling (#125), because a continuously-draining bucket admits its capacity AND its rate inside one rolling minute — so 125,000 is worth 250,000 in the worst burst, which is the whole ceiling and no more.
  safetyThreshold: OFF # Harm block threshold: OFF, BLOCK_NONE, BLOCK_ONLY_HIGH, BLOCK_MEDIUM_AND_ABOVE, BLOCK_LOW_AND_ABOVE
  maxLlmCalls: 4 # Max chained tool calls per request
  hedgeAfterMs: 5000 # Start the same call on the fallback model if Gemini has not answered in this many ms, and keep whichever answers first; 0 disables. Production per-turn llm_ms for no-tool turns is p50 1.9s / p75 2.7s / p90 6.2s / p95 14.4s, so 5s hedges roughly the slowest 10-15% of calls at the cost of a second call on each of them.
  liveMaxRetries: 2 # Retry attempts after a failed live Gemini response
  retryRpmFloor: 2 # Minimum remaining RPM required before a live retry
  retryBackoffBaseMs: 1000 # Initial full-jitter retry backoff in ms (doubles each retry)
  retryBackoffCapMs: 12000 # Maximum full-jitter retry backoff in ms
  turnDeadlineMs: 63000 # 3 attempts x 20s timeout + 3s worst-case jitter; keeps gemini.timeout at #43's measured calibration

fallback:
  model: Qwen/Qwen3.5-122B-A10B # ModelScope API-Inference model that answers when Gemini is overloaded, timing out or out of daily quota
  baseUrl: https://api-inference.modelscope.ai/v1 # OpenAI-compatible ModelScope endpoint
  timeoutMs: 15000 # Per-request deadline for the fallback model (measured median ~1.3s with thinking off)
  stickyMs: 300000 # After Gemini fails and the fallback answers, later turns go straight to the fallback for this long; 0 disables

rateLimit:
  rpm: 15 # Requests per minute (Gemini free tier: 15)
  rpd: 500 # Requests per day (Gemini free tier: 500)

session:
  ttl: 500000 # Idle session timeout in ms before ADK session is destroyed
  windowSize: 20 # Max messages stored in ADK session history (rehydrated from SQLite)
  maxRehydrationAge: 7200000 # Max age of messages to rehydrate in ms (2h, older messages are skipped)
  historyRetentionDays: 7 # Days before session history is auto-pruned (hourly check)

discord:
  maxMessageLength: 1500 # Char limit for bot replies (effective ceiling is 4000 minus the tool-disclosure footer)
  maxInFlightAttachmentBytes: 33554432 # 32 MB ceiling on attachment bytes downloading across ALL channels at once; each byte costs ~4.7x its size in RSS, so this holds worst-case residency near 20% of the container's 1g mem_limit ; at one attachment per turn the largest turn reserves 10 MB, so three channels can download concurrently rather than one holding off the rest (see docs/multimodal.md)

memory:
  bufferSize: 30 # Max messages in passive ring buffer per channel (in-memory)
  contextSize: 10 # Max overheard messages injected into system prompt per request
  channelMonitorTtlMs: 86400000 # How long a channel stays monitored after last @mention (24h)
  maxClaimsPerTurn: 10 # Hard cap on claims injected into one response
  retrievalTokenBudget: 350 # Approximate token budget for the claims envelope
  recentParticipantLimit: 3 # Recent non-speaker participants considered for retrieval
  speakerMinShare: 0.5 # Minimum fraction of selected claims reserved for the speaker
  maxActiveClaimsPerUser: 20 # Active claim cap per user (pinned claims are exempt)
  claimRetentionDays: 90 # Days before inactive, unpinned claims expire
  salienceHalfLifeDays: 30 # Days for claim salience to halve after its last observation
  recallCooldownMs: 21600000 # Recalled claims lose 0.75 score for this long unless the message matches them
  episodeLullMs: 180000 # Close an open memory episode after this much channel silence
  episodeMaxMessages: 25 # Close an episode at this many delta messages; leave room for three context lines
  admitThreshold: 0.5 # Minimum Jev lasting_fact probability; unavailable or lower judgments drop the episode
  verifyThreshold: 0.5 # Minimum Jev probability for durable and attributed operations
  vaultExportDir: data/vault # Directory for read-only Obsidian vault exports

metrics:
  retentionDays: 90 # Days before response and extraction events are auto-pruned
  diagnosticsRetentionHours: 72 # Hours before failure diagnostics (which hold the triggering message verbatim) are auto-pruned

emoji:
  probability: 0.33 # Chance of reacting when a keyword rule matches (0-1)
  cooldownMs: 180000 # Per-channel cooldown between reactions in ms

reminders:
  checkIntervalMs: 5000 # How often the scheduler checks for due reminders in ms
  maxPerUser: 5 # Max active reminders per user
  staleThresholdMs: 300000 # Reminders older than this past their due time are auto-dropped

games:
  hangmanLives: 6 # Wrong guesses before game over
  hangmanTimeoutMs: 120000 # Inactivity timeout per hangman game in ms
  shiritoriTimeoutMs: 120000 # Inactivity timeout per shiritori turn in ms
  shinyChance: 0.01 # Chance of hatching a shiny buddy pet (0-1)

statusCycleMs: 900000 # Bot status rotation interval in ms (15 min)

timezone: Asia/Singapore # IANA timezone for time-of-day features (override with TZ env var)

logging:
  level: info # Log level: debug, info, warn, error
