name: Deploy to Pi

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'
      - 'graphify-out/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_TOKEN: ci-dummy-discord-token
      DISCORD_CLIENT_ID: ci-dummy-discord-client-id
      GEMINI_API_KEY: ci-dummy-gemini-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: node_modules/.bin/biome check .

      - name: Run tests
        run: npm test

      - name: Run perf tests
        run: npm run test:perf

  images:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: rokabot, context: . }
          - { name: rokabot-asr, context: ./asr }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: GIT_COMMIT=${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}

      - name: Export the digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [rokabot, rokabot-asr]
    steps:
      # Exact names, not a pattern: `digest-rokabot-*` also matches the rokabot-asr artifacts.
      - name: Download amd64 digests
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.name }}-amd64
          path: /tmp/digests

      - name: Download arm64 digests
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.name }}-arm64
          path: /tmp/digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag sha and edge
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          docker buildx imagetools create -t "$IMAGE:sha-${GITHUB_SHA::7}" -t "$IMAGE:edge" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"

      # The Pi and every user pull without logging in, so a private package would break every deploy silently.
      - name: Check anonymous pulls work
        run: |
          docker logout ghcr.io
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          if ! docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" > /dev/null; then
            echo "::error::$IMAGE is not publicly pullable. Set the package to Public: GitHub > Packages > ${{ matrix.name }} > Package settings > Change visibility."
            exit 1
          fi

  # One stable check name for the main-pr-ci-gate ruleset. A skipped job counts as passing for a required check,
  # so it runs even when `images` is skipped or fails and then fails itself.
  images-ok:
    needs: images
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: All image builds passed
        env:
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          [ "$IMAGES_RESULT" = success ] || { echo "::error::Image builds finished as $IMAGES_RESULT"; exit 1; }
          echo "All image builds passed"

  notify-images-failure:
    needs: [images, manifest]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Notify Discord (failure)
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\":\"**Image build failed** \u274c\n\`${GITHUB_SHA::7}\`\nCheck: https://github.com/AlaskanTuna/rokabot/actions\"}" \
            "$WEBHOOK_URL" > /dev/null

  deploy:
    needs: [test, manifest]
    if: github.event_name == 'push'
    runs-on: self-hosted
    # The first pull after a speech-model change downloads about 1 GB of image layers.
    timeout-minutes: 25
    concurrency:
      group: pi-deploy
      cancel-in-progress: false

    steps:
      - name: Pull latest changes
        run: cd ~/rokabot && git fetch origin main && git reset --hard "$GITHUB_SHA"

      # Recreating the container discards its Docker logs, so keep the outgoing container's for diagnosis.
      - name: Archive the outgoing container's logs
        run: |
          mkdir -p ~/rokabot/logs
          ARCHIVE=~/rokabot/logs/roka-$(date -u +%Y%m%dT%H%M%SZ).log.gz
          docker compose -f ~/rokabot/docker-compose.yml logs --no-color --no-log-prefix --timestamps roka 2>/dev/null | gzip > "$ARCHIVE" || true
          [ "$(gzip -cd "$ARCHIVE" | head -c 1 | wc -c)" -gt 0 ] || rm -f "$ARCHIVE"
          find ~/rokabot/logs -name 'roka-*.log.gz' -mtime +30 -delete

      - name: Pull and restart
        run: |
          cd ~/rokabot
          export ROKA_TAG="sha-${GITHUB_SHA::7}" GIT_COMMIT="${GITHUB_SHA::7}"
          docker compose pull roka asr
          # Recorded after a successful pull, so .env only names an image that is on disk.
          # A manual compose command on the Pi then keeps this image rather than :stable.
          sed -i '/^ROKA_TAG=/d' .env && { [ -z "$(tail -c1 .env)" ] || echo >> .env; } && echo "ROKA_TAG=$ROKA_TAG" >> .env
          docker compose up -d --no-build

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            RESPONSE=$(curl -sf http://localhost:3000/ 2>/dev/null || echo '{"status":"unreachable"}')
            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null)
            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          docker compose -f ~/rokabot/docker-compose.yml logs --tail 20
          exit 1

      - name: Prune old images
        run: |
          cd ~/rokabot
          for repo in ghcr.io/alaskantuna/rokabot ghcr.io/alaskantuna/rokabot-asr; do
            bash scripts/prune-images.sh "$repo" "sha-${GITHUB_SHA::7}" || echo "::warning::prune failed for $repo"
          done
          docker image prune -f > /dev/null

      - name: Notify Discord (success)
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          COMMIT=$(cd ~/rokabot && git log -1 --format='%h %s')
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\":\"**Deploy succeeded** \u2705\n\`$COMMIT\`\"}" \
            "$WEBHOOK_URL" > /dev/null

      - name: Notify Discord (failure)
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          COMMIT=$(cd ~/rokabot && git log -1 --format='%h %s')
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\":\"**Deploy failed** \u274c\n\`$COMMIT\`\nCheck: https://github.com/AlaskanTuna/rokabot/actions\"}" \
            "$WEBHOOK_URL" > /dev/null
