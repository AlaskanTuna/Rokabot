name: Deploy to Pi

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'
      - 'graphify-out/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_TOKEN: ci-dummy-discord-token
      DISCORD_CLIENT_ID: ci-dummy-discord-client-id
      GEMINI_API_KEY: ci-dummy-gemini-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: node_modules/.bin/biome check .

      - name: Run tests
        run: npm test

      - name: Run perf tests
        run: npm run test:perf

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: self-hosted
    # The first build after a speech-model change downloads ~500 MB of models on the Pi.
    timeout-minutes: 25

    steps:
      - name: Pull latest changes
        run: cd ~/rokabot && git fetch origin main && git reset --hard origin/main

      # Recreating the container discards its Docker logs, so keep the outgoing container's for diagnosis.
      - name: Archive the outgoing container's logs
        run: |
          mkdir -p ~/rokabot/logs
          ARCHIVE=~/rokabot/logs/roka-$(date -u +%Y%m%dT%H%M%SZ).log.gz
          docker compose -f ~/rokabot/docker-compose.yml logs --no-color --no-log-prefix --timestamps roka 2>/dev/null | gzip > "$ARCHIVE" || true
          [ "$(gzip -cd "$ARCHIVE" | head -c 1 | wc -c)" -gt 0 ] || rm -f "$ARCHIVE"
          find ~/rokabot/logs -name 'roka-*.log.gz' -mtime +30 -delete

      - name: Build and restart
        run: cd ~/rokabot && export GIT_COMMIT=$(git rev-parse --short HEAD) && docker compose up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            RESPONSE=$(curl -sf http://localhost:3000/ 2>/dev/null || echo '{"status":"unreachable"}')
            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null)
            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          docker compose -f ~/rokabot/docker-compose.yml logs --tail 20
          exit 1

      - name: Notify Discord (success)
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          COMMIT=$(cd ~/rokabot && git log -1 --format='%h %s')
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\":\"**Deploy succeeded** \u2705\n\`$COMMIT\`\"}" \
            "$WEBHOOK_URL" > /dev/null

      - name: Notify Discord (failure)
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK_URL" ] && exit 0
          COMMIT=$(cd ~/rokabot && git log -1 --format='%h %s')
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\":\"**Deploy failed** \u274c\n\`$COMMIT\`\nCheck: https://github.com/AlaskanTuna/rokabot/actions\"}" \
            "$WEBHOOK_URL" > /dev/null
