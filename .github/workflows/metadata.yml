name: Metadata

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled, assigned, unassigned]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # This workflow must never check out PR code. pull_request_target runs against the base
      # repository, so checkout takes no ref and the script reads only the title, labels and
      # assignees from the event payload.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Label and assign
        run: node scripts/metadata.ts
        env:
          GH_TOKEN: ${{ github.token }}
