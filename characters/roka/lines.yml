commands: # Slash command descriptions, registered on every start; Discord allows 100 characters
  ask: Ask {{char}} anything — she looks things up when she needs to # /ask
  remind: Ask {{char}} to remind you about something! # /remind
  hangman: Play Hangman with {{char}}! # /hangman
  shiritori: Play Shiritori (word chain) with {{char}}! # /shiritori
  stats: See {{char}}’s server activity notebook # /stats
  report: File a bug report for {{char}} # /report
stats: # The /stats notebook
  notInDms: Ara~ stats are for the shop floor, not letters, ne~ # /stats run outside a server
  notYours: Ara~ these little ledger tabs are for the one who opened them, ne~ # Someone else picked a view
  reachedBy: How People Reach Her # Overview label for how people start a chat
  knownBest: Who She Knows Best # Memory heading over the members she remembers most
  quietMood: A Quiet Little Pause # The server mood before any mood is recorded
  emptyMood: The server mood is waiting for its first little chat # Mood caption before any mood is recorded
  footers: # The closing line of each view
    overview: Every little chat helps this place feel more like home.
    memory: 'A little peek at what I treasure — the rest stays between us, ne~'
    nerd: The gears are humming along nicely behind the counter.
  remembers: # A remembered member's line, by memory predicate; misc also stands in when the memory has no predicate
    nickname: I remember what they like to be called~
    language_spoken: I remember which words feel like home to them~
    nationality: I remember where their story begins~
    pronouns: I remember how they like to be addressed~
    pets: I remember their adorable little companions~
    daily_routine: I remember the rhythm of their day~
    diet: I remember what keeps them happily fed~
    general_occupation: I remember what keeps their days busy~
    likes: I remember the things they like~
    dislikes: I remember the things they are not fond of~
    favorite_anime: I remember their favorite anime~
    favorite_game: I remember their favorite game~
    favorite_music: I remember the music they hold close~
    hobby: I remember what they enjoy doing~
    currently_watching: I remember what they have been watching~
    relationship_to: I remember who they hold dear~
    friend_group: I remember who they spend time with~
    communication_style: I remember how they like to talk~
    humor_style: I remember what makes them laugh~
    catchphrase: I remember the words they always say~
    teasing_habit: I remember the way they tease~
    recommends: I remember their little recommendations~
    complains_about: I remember what gets under their skin~
    strong_opinion: I remember what they feel strongly about~
    misc: I remember a little something about them~
  remembersOther: I remember their {{label}}~ # A predicate missing above; {{label}} is its name in lower case
  chartColors: # The chart images
    background: '#17141f'
    text: '#f6efff'
    mutedText: '#bfb4ca'
    secondaryText: '#d9cfdf'
    grid: '#332b40'
    heatmapEmpty: '#241f2e'
    heatmapLow: '#4d2b3d'
    heatmapMedium: '#8a4a66'
    heatmapHigh: '#cf6d97'
    heatmapPeak: '#f7a6c6'
    growthStroke: '#f7a6c6'
    latencyLine: '#c4a7e7'
    latencyLow: '#6f5a94'
    latencyMedium: '#8f78b8'
    latencyHigh: '#b295d9'
    latencyPeak: '#dcc8f7'
footers: # Labels in the line under a reply that says what she did; code adds the leading "-# 🌸"
  tools: # By tool name
    roll_dice: cast the dice
    flip_coin: tossed a coin
    get_current_time: checked the clock
    get_weather: checked the weather
    search_web: searched the web
    search_anime: looked up anime
    get_anime_schedule: checked airing times
    set_reminder: set a reminder
    list_reminders: listed reminders
    cancel_reminder: cancelled a reminder
    remember_user: saved a memory
    recall_user: recalled a memory
    forget_user: forgot a memory
  post: # A linked post read before the reply; {{post}} is the kind, like "X post"
    found: peeked at the {{post}}
    failed: "couldn't open the {{post}}"
  replies: # A linked post's replies
    found: read the replies
    failed: "couldn't read the replies"
  watch: # How much of a video or audio clip she took in; {{media}} is "video", "clip" or a platform's, like "X video"
    video:
      whole: watched the {{media}}
      most: watched most of the {{media}}
      part: watched part of the {{media}}
      skim: skimmed the {{media}}
      remembered: remembered the {{media}}
      failed: "couldn't watch the {{media}}"
    audio:
      whole: heard the {{media}}
      most: heard most of the {{media}}
      part: heard part of the {{media}}
      skim: skimmed the {{media}}
      remembered: remembered the {{media}}
      failed: "couldn't hear the {{media}}"
