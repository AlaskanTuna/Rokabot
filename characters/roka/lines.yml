# Every line the bot posts in Roka's voice outside the model's own replies. A list is a pool: each post draws one
# line at random. {{char}}, {{char_full}} and {{world}} work in every line; any other {{slot}} works only in a key
# whose comment names it, and code fills it when the line is posted.
replies:
  decline: # The rate limiter turned a message away
    - ちょっと待ってね~ Give me a moment.
    - "Mou~ I'm a bit busy right now. Hold on, okay?"
    - Ara~ so impatient. Just a little bit longer~
    - "Fufu~ everyone's talking at once. Let me catch my breath."
    - "Ah, sorry — I'm in the middle of something. I'll be right back!"
  busy: # The channel's previous reply is still being written
    - "I'm still thinking~ just a moment, okay?"
    - "Mou~ hold on, I haven't finished my thought yet!"
    - "Ah, wait wait — I'm still working on my answer~"
    - Fufu~ so eager. Let me finish what I was saying first!
    - "One thing at a time~ I'm almost done, I promise!"
  error: # A turn or a /stats view failed outright
    - Nn... something feels off. Let me try again in a bit, okay?
    - "Ah, that's strange... my thoughts got all jumbled up. Give me a moment."
    - Mou, I lost my train of thought... sorry about that.
attachments: # Added to a reply when an attachment was not read whole, so a partial answer is not taken as a full one
  unsupported: # A file type the model cannot open
    - "Ah — I couldn't open that file, sorry~ Could you tell me what's in it?"
    - "Mou~ that kind of file is beyond me. Describe it for me and I'll help!"
    - "Nn... I can't peek inside that one. Images I can see, but not that~"
    - "Sorry, that attachment isn't something I can look at — but I'm listening!"
  partial: # Only the opening of a long file was sent
    - That one was rather long, so I only got through the beginning of it~
    - 'Mm, too big to take all at once — I only saw the first part, so ask me again if the rest matters!'
    - "Nn... that's a big one. I stopped partway through, so I might have missed the ending~"
    - 'I could only manage the opening of that — it was much too long for me to take in one go!'
  oversized: # The file would cost too many tokens to read in one turn
    - "That's far too much for me to take in all at once~ Send me a smaller piece and I'll look properly."
    - Mou, that would take me all afternoon to get through! Something shorter, please?
    - "Ara, you've given me enough to read for a week. Trim it down a little for me?"
    - "That's a bit much for one sitting, ne? Give me a shorter one and I'll go through it properly."
  skipped: # More attachments arrived than one turn takes
    - Ara~ that is more than I can peek at in one go! I looked at the first ones; send the rest separately, ne~
    - Mou~ I can only look through so many at once! I opened the first ones, so send the others in another message.
    - Fufu, that was a lot to browse in one sitting~ I checked the first ones; bring me the rest separately, okay?
    - Whoa, too many for one look! I took the first ones, so send the rest in a separate message, okay?
reliability: # Sent in place of the model's reply when a turn goes wrong
  safety: "Huh? Let's not get into that one~" # The provider blocked the reply on safety grounds
  recitation: "Ah, I don't think I should repeat that one exactly~" # The provider blocked the reply as a recitation
  terminal: "Eep, something went wrong on my side. Let's try again later~" # Every retry and fallback failed
  empty: # The model returned nothing usable
    - Hmm? Sorry, I spaced out for a moment there~
    - Ah, what was that? I got distracted by something.
    - Sorry, sorry, my mind wandered. Say that again?
    - "I wasn't paying attention... don't tell anyone, okay?"
tools: # The /anime and /remind commands
  error: # A tool command failed
    - Nn... something went wrong. Maybe try again later?
    - "Ah, that didn't work... sorry about that~"
    - Mou, I ran into a little trouble. Give me another chance?
  flavor: # Opens each reply of that command
    anime: ['Ooh, let me look that up! ♪', 'Anime search time~ fufu~', 'Let me see what I can find~!']
    schedule: ["Let's see what's airing~", 'Checking the schedule for you! ♪', "Time to see what's on today~"]
    remind: ["I'll remember for you~", 'Leave it to me! ♪', "I'll make sure you don't forget~"]
  notYours: "Those buttons aren't for you~" # Someone else pressed a result's page button
  noAnime: "Hmm, I couldn't find anything for {{search}}... Maybe try something different?" # {{search}}: the quoted title, or "those filters"
  noSchedule: Hmm, nothing found for that~ Maybe try something else? # /anime schedule found nothing
reminders: # The /remind command and the reminders it delivers
  unknown: "Hmm, I don't know that subcommand~" # An unknown /remind subcommand
  refused: Mou~ {{reason}} # The reminder was not saved; {{reason}} says why
  setIn: "⏰ **Reminder set!** I'll remind you {{when}} ({{time}} {{timezone}})" # /remind in; {{when}} is relative, {{time}} the clock time
  setAt: "⏰ **Reminder set for {{time}} {{timezone}}!** I'll remind you {{when}}" # /remind at; same slots as setIn
  none: No active reminders~ # /remind list with nothing pending
  notFound: "Hmm, I couldn't find that reminder~ Maybe it already went off?" # /remind cancel with an unknown id
  notYours: "That reminder doesn't belong to you~ You can only cancel your own reminders!" # /remind cancel on someone else's
  cancelled: 'Got it~ Cancelled reminder **#{{id}}**: "{{task}}"' # /remind cancel; {{id}} and {{task}}
  delivered: 'Hey {{mention}}~ you asked me to remind you: "{{task}}" ♪' # Posted in the channel; {{mention}} pings the user
  deliveredByDm: "Hey~ you asked me to remind you: \"{{task}}\" ♪\n\n-# (Sent as DM because I couldn't reach the original channel)" # Sent by DM when the channel is gone
games: # Game lines that are not part of a game's own rules
  error: Nn... something went wrong. Maybe try again later? # A game command failed
  hangmanTimeout: "Time's up~ The word was **{{word}}**. You took too long! 💤" # Hangman ran out of time; {{word}}
  shiritoriWinner: "**{{player}}** took too long... they're out! 💤\n\n**{{winner}}** wins the game! Congratulations~ ♪" # The last player standing wins
  shiritoriNext: "**{{player}}** took too long... they're out! 💤 Your turn, **{{next}}**!" # The game goes on with {{next}}
