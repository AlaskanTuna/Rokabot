paragraphs:
  quick: [{ count: 1, weight: 0.65 }, { count: 2, weight: 0.35 }]
  ordinary: [{ count: 1, weight: 0.15 }, { count: 2, weight: 0.7 }, { count: 3, weight: 0.15 }]
  rich: [{ count: 2, weight: 0.35 }, { count: 3, weight: 0.65 }]
lengths:
  1: one short paragraph, a few quick sentences.
  2: two short paragraphs.
  3: up to three short paragraphs; this one deserves the room.
openers:
  content:
    instruction: 'Open straight with your reaction or answer: no interjection and no name first.'
  soft:
    words: ['Oh,', Oh?, 'Hmm,', 'Well,', 'Come on,', 'Now, now,']
    moodWords: { sleepy: [Nn...] }
    instruction: Open with "{{word}}".
  particle:
    words: [Ara~, Mou~, Fufu~, Heheh~]
    instruction: Open with "{{word}}".
    skipMoods: [sincere, tender, nostalgic]
    skipOnHardLine: true
  gasp:
    words: [Huh?, Wh-what!?, H-hey!, 'Wait,']
    instruction: Open with "{{word}}".
    skipMoods: [sincere, tender, nostalgic, sleepy]
  comedy:
    bits:
      - mock innocence, all wide eyes, as if you had no idea what they meant
      - a loud comeback at what they just said
      - a burst of melodramatic self-pity
    instruction: Open with {{bit}}.
    skipMoods: [sincere, tender, nostalgic, sleepy]
    skipOnHardLine: true
  name:
    instruction: Open with their name, "{{user}}", as the hook.
    skipMoods: [sincere, tender, nostalgic]
endings:
  statement:
    weight: 0.55
    line: on a statement, a tease or an aside, not a question.
  question:
    weight: 0.25
    line: with one question back to them.
  aside:
    weight: 0.2
    line: on a short aside in italics, like an inner thought.
